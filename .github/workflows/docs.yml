name: Docs

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.markdownlint.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - '.markdownlint.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint-cli2
        run: |
          npx -y markdownlint-cli2 \
            README.md CONTRIBUTING.md SECURITY.md SUPPORT.md \
            CHANGELOG.md CODE_OF_CONDUCT.md docs/*.md

  links:
    name: Link check
    runs-on: ubuntu-latest
    # Link rot is reported but does not block PRs: external sites rate-limit
    # or disappear for reasons unrelated to the change under review.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2
            'README.md' 'CONTRIBUTING.md' 'SECURITY.md' 'SUPPORT.md' 'docs/*.md'
          fail: false
