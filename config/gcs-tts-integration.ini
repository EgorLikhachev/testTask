; Тестовый конфиг для интеграционной проверки со SITL (scripts/integration.sh):
; пороги батареи подняты, антиспам укорочен, чтобы сценарий проходил быстро.

[udp]
host = 127.0.0.1
port = 14550

[battery]
warn_percent = 60
critical_percent = 45
recover_margin_percent = 5

[antispam]
default_sec = 4
mode_change_sec = 4
arm_sec = 3
battery_sec = 5
statustext_sec = 4
status_hotkey_sec = 2

[tts]
enabled = true
program = espeak-ng
voice = ru
speed = 150
queue_limit = 16

[hotkey]
status_key = F2
