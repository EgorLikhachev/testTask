; Конфигурация mav-voice-gcs.
; Все ключи опциональны: отсутствующие берутся из значений по умолчанию.

[udp]
; Куда приходит MAVLink от SITL (наш слушающий сокет) и кому отвечаем.
host = 127.0.0.1
port = 14550
sysid = 255
compid = 190
; Какой борт слушать: 0 — авто-захват первого валидного, 1..255 — только его.
vehicle_sysid = 0

[battery]
; Пороги заряда, %, для предупреждения и критического события.
warn_percent = 25
critical_percent = 15
; Гистерезис снятия тревоги, % (тревога снимается при заряде выше порога + margin).
recover_margin_percent = 5

[link]
; Нет сообщений дольше loss_sec -> «Потеря связи с бортом».
loss_sec = 4

[antispam]
; Одно и то же событие озвучивается не чаще, чем раз в N секунд.
default_sec = 8
mode_change_sec = 10
arm_sec = 5
battery_sec = 30
statustext_sec = 15
link_sec = 10
status_hotkey_sec = 2

[tts]
enabled = true
program = espeak-ng
voice = ru
speed = 150
; Максимум фраз в очереди; при переполнении выбрасываются старые некритичные.
queue_limit = 16
; В режиме GCS_TTS_WAV_DIR хранить не более N последних WAV-файлов.
wav_keep = 64

[log]
; Запись телеметрии сессии (сырые кадры + метки времени) в tlog-<дата>.tlog.
enabled = true
dir = logs

[hotkey]
; Клавиша статус-спича (внутри окна приложения).
status_key = F2
