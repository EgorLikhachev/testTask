; Конфигурация mav-voice-gcs.
; Все ключи опциональны: отсутствующие берутся из значений по умолчанию.

[udp]
; Куда приходит MAVLink от SITL (наш слушающий сокет) и кому отвечаем.
host = 127.0.0.1
port = 14550
sysid = 255
compid = 190
; Какой борт слушать: 0 — авто-захват первого валидного, 1..255 — только его.
vehicle_sysid = 0

[battery]
; Пороги заряда, %, для предупреждения и критического события.
warn_percent = 25
critical_percent = 15
; Гистерезис снятия тревоги, % (тревога снимается при заряде выше порога + margin).
recover_margin_percent = 5

[link]
; Нет сообщений дольше loss_sec -> «Потеря связи с бортом».
loss_sec = 4

[antispam]
; Одно и то же событие озвучивается не чаще, чем раз в N секунд.
default_sec = 8
mode_change_sec = 10
arm_sec = 5
battery_sec = 30
statustext_sec = 15
link_sec = 10
status_hotkey_sec = 2

[tts]
enabled = true
; Бэкенд: espeak | piper (нейросетевой, ставится через scripts/setup_piper.sh).
backend = espeak
program = espeak-ng
voice = ru
speed = 150
; Максимум фраз в очереди; при переполнении выбрасываются старые некритичные.
queue_limit = 16
; В режиме GCS_TTS_WAV_DIR хранить не более N последних WAV-файлов.
wav_keep = 64
; --- piper (используется при backend = piper) ---
;piper_bin = piper
;piper_model = ~/.local/share/mav-voice-gcs/voices/ru_RU-irina-medium.onnx
; Команда воспроизведения WAV (может содержать аргументы): paplay | pw-play | aplay
;piper_play = paplay
; Темп речи: 0.5 быстрее … 2.0 медленнее.
;piper_length_scale = 1.0

[log]
; Запись телеметрии сессии (сырые кадры + метки времени) в tlog-<дата>.tlog.
enabled = true
dir = logs

[hotkey]
; Клавиша статус-спича (внутри окна приложения).
status_key = F2
; Глобальный перехват (X11/XWayland): статус по F2 даже вне фокуса окна.
global = true

[ui]
; Крест окна сворачивает в системный трей (если трей доступен), выход — из меню трея.
hide_on_close = true
